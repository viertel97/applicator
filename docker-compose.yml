services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: applicator
      POSTGRES_USER: applicator
      POSTGRES_PASSWORD: applicator
    volumes: ["pgdata:/var/lib/postgresql/data"]

  api:
    build: ./backend
    env_file: .env
    depends_on: [db]
    volumes:
      - ./data:/app/data
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
