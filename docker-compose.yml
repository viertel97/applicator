services:
  db:
    image: postgres:16
    profiles: ["db"]
    environment:
      POSTGRES_DB: applicator
      POSTGRES_USER: applicator
      POSTGRES_PASSWORD: applicator
    volumes: ["./pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applicator -d applicator"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://applicator:applicator@192.168.178.110:5432/applicator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://applicator:applicator@192.168.178.110:5432/applicator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]

  bot:
    build: ./bot
    profiles: ["bot"]
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8100:80"]

